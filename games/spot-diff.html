<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>找不同 - 大脑训练</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh; display: flex; justify-content: center;
            align-items: center; color: #e0e0e0;
        }
        .app { width: 480px; max-width: 96vw; text-align: center; }
        .back-link { display: inline-block; margin-bottom: 16px; color: #888; text-decoration: none; font-size: 13px; transition: color 0.2s; }
        .back-link:hover { color: #6c5ce7; }
        .header h1 { font-size: 28px; color: #fff; margin-bottom: 4px; }
        .header p { font-size: 13px; color: #888; }
        .stats { display: flex; justify-content: center; gap: 24px; margin: 16px 0; }
        .stat-val { font-size: 28px; font-weight: 700; color: #fff; font-variant-numeric: tabular-nums; }
        .stat-val.accent { color: #6c5ce7; }
        .stat-label { font-size: 11px; color: #666; margin-top: 2px; letter-spacing: 1px; }
        .hint { font-size: 14px; color: #6c5ce7; margin-bottom: 12px; min-height: 20px; font-weight: 600; }

        .grid-wrapper { display: flex; justify-content: center; margin: 16px 0; }
        .diff-grid {
            display: grid; gap: 8px; padding: 16px;
            background: rgba(255,255,255,0.03); border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.06);
        }
        .diff-cell {
            border-radius: 12px; cursor: pointer;
            transition: all 0.15s ease;
            display: flex; justify-content: center; align-items: center;
            position: relative; overflow: hidden;
        }
        .diff-cell:hover { transform: scale(1.06); }
        .diff-cell:active { transform: scale(0.95); }
        .diff-cell .shape {
            width: 60%; height: 60%; transition: all 0.15s;
        }
        .diff-cell.correct {
            animation: correctPulse 0.5s ease;
        }
        .diff-cell.wrong {
            animation: wrongShake 0.4s ease;
        }
        .diff-cell.found {
            box-shadow: 0 0 0 3px #55efc4, 0 0 20px rgba(85,239,196,0.3);
        }

        @keyframes correctPulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        @keyframes wrongShake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-5px); }
            40% { transform: translateX(5px); }
            60% { transform: translateX(-3px); }
            80% { transform: translateX(3px); }
        }

        .actions { display: flex; justify-content: center; gap: 12px; margin-top: 16px; }
        .btn {
            padding: 11px 32px; border: none; border-radius: 12px;
            font-size: 15px; font-weight: 700; cursor: pointer;
            transition: all 0.2s; letter-spacing: 1px;
        }
        .btn:active { transform: scale(0.96); }
        .btn-primary {
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
            color: #fff; box-shadow: 0 4px 15px rgba(108,92,231,0.3);
        }
        .btn-primary:hover { box-shadow: 0 6px 20px rgba(108,92,231,0.5); }
        .btn-secondary { background: rgba(255,255,255,0.08); color: #aaa; border: 1px solid rgba(255,255,255,0.1); }
        .btn-secondary:hover { background: rgba(255,255,255,0.12); color: #ddd; }

        .result-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6); backdrop-filter: blur(8px);
            display: flex; justify-content: center; align-items: center;
            z-index: 200; opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }
        .result-overlay.show { opacity: 1; pointer-events: auto; }
        .result-card {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 20px;
            padding: 36px 44px; text-align: center;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
            transform: scale(0.9); transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
        }
        .result-overlay.show .result-card { transform: scale(1); }
        .result-card h2 { font-size: 24px; color: #fff; margin-bottom: 12px; }
        .result-score { font-size: 48px; font-weight: 700; color: #6c5ce7; margin: 12px 0; }
        .result-detail { font-size: 14px; color: #888; margin-bottom: 20px; line-height: 1.8; }
    </style>
</head>
<body>
<div class="app">
    <a class="back-link" href="../index.html">← 返回游戏列表</a>
    <div class="header">
        <h1>👁️ 找不同</h1>
        <p>从相似图案中找出不同的那个，训练视觉辨别力</p>
    </div>
    <div class="stats">
        <div><div class="stat-val accent" id="level">1</div><div class="stat-label">关卡</div></div>
        <div><div class="stat-val" id="score">0</div><div class="stat-label">得分</div></div>
        <div><div class="stat-val" id="lives">❤️❤️❤️</div><div class="stat-label">生命</div></div>
        <div><div class="stat-val" id="best">0</div><div class="stat-label">最高分</div></div>
    </div>
    <div class="hint" id="hint">找出不同的那个！</div>
    <div class="grid-wrapper">
        <div class="diff-grid" id="diffGrid"></div>
    </div>
    <div class="actions">
        <button class="btn btn-secondary" onclick="resetGame()">重置</button>
        <button class="btn btn-primary" id="startBtn" onclick="startGame()">开始</button>
    </div>
</div>

<div class="result-overlay" id="resultOverlay">
    <div class="result-card">
        <h2 id="resultTitle">游戏结束</h2>
        <div class="result-score" id="resultScore">0</div>
        <div class="result-detail" id="resultDetail"></div>
        <button class="btn btn-primary" onclick="closeResult(); startGame();">再来一次</button>
    </div>
</div>

<script>
let currentLevel = 1, lives = 3, score = 0, isPlaying = false;
let oddIndex = -1, answered = false;
let best = parseInt(localStorage.getItem('spotDiffBest') || '0');
const bestEl = document.getElementById('best');
bestEl.textContent = best;

// Shape types
const SHAPES = ['circle', 'square', 'triangle', 'diamond', 'star', 'hexagon'];
const COLORS = [
    '#e17055', '#00cec9', '#6c5ce7', '#fdcb6e', '#55efc4',
    '#fd79a8', '#74b9ff', '#a29bfe', '#fab1a0', '#81ecec',
    '#ff7675', '#ffeaa7'
];

function getGridSize(level) {
    if (level <= 3) return 3;       // 9 items
    if (level <= 6) return 4;       // 16 items
    if (level <= 10) return 5;      // 25 items
    return 6;                        // 36 items
}

function getDifficulty(level) {
    // Returns how different the odd one is (0=very subtle, 1=obvious)
    if (level <= 2) return { shapeDiff: true, colorDiff: true, sizeDiff: true };
    if (level <= 4) return { shapeDiff: true, colorDiff: true, sizeDiff: false };
    if (level <= 7) return { shapeDiff: true, colorDiff: false, sizeDiff: false };
    return { shapeDiff: false, colorDiff: false, sizeDiff: false }; // very subtle
}

function generatePuzzle() {
    const gridSize = getGridSize(currentLevel);
    const total = gridSize * gridSize;
    const diff = getDifficulty(currentLevel);

    // Pick random base shape and color
    const baseShape = SHAPES[Math.floor(Math.random() * SHAPES.length)];
    const baseColor = COLORS[Math.floor(Math.random() * COLORS.length)];
    const baseRotation = Math.floor(Math.random() * 4) * 90;
    const baseSize = 50 + Math.floor(Math.random() * 15);

    // Pick odd index
    oddIndex = Math.floor(Math.random() * total);

    // Determine odd properties - make it subtly different
    let oddShape = baseShape;
    let oddColor = baseColor;
    let oddRotation = baseRotation;
    let oddSize = baseSize;

    // Choose what differs
    const diffTypes = [];
    if (diff.colorDiff) diffTypes.push('color');
    if (diff.shapeDiff) diffTypes.push('shape');
    if (diff.sizeDiff) diffTypes.push('size');

    // Always have at least one difference
    if (diffTypes.length === 0) diffTypes.push('rotation');

    // Pick 1-2 differences
    const numDiffs = Math.min(diffTypes.length, currentLevel <= 3 ? 2 : 1);
    const chosenDiffs = diffTypes.sort(() => Math.random() - 0.5).slice(0, numDiffs);

    if (chosenDiffs.includes('color')) {
        // Slightly different shade
        oddColor = shiftColor(baseColor);
    }
    if (chosenDiffs.includes('shape')) {
        // Different shape
        const otherShapes = SHAPES.filter(s => s !== baseShape);
        oddShape = otherShapes[Math.floor(Math.random() * otherShapes.length)];
    }
    if (chosenDiffs.includes('size')) {
        oddSize = baseSize + (Math.random() > 0.5 ? 12 : -12);
    }
    if (chosenDiffs.includes('rotation')) {
        oddRotation = (baseRotation + 15 + Math.floor(Math.random() * 30)) % 360;
    }

    return { gridSize, total, baseShape, baseColor, baseRotation, baseSize, oddShape, oddColor, oddRotation, oddSize };
}

function shiftColor(hex) {
    // Shift hue slightly to create a subtle color difference
    const r = parseInt(hex.slice(1,3), 16);
    const g = parseInt(hex.slice(3,5), 16);
    const b = parseInt(hex.slice(5,7), 16);
    const shift = 40 + Math.floor(Math.random() * 40);
    const nr = Math.min(255, Math.max(0, r + (Math.random() > 0.5 ? shift : -shift)));
    const ng = Math.min(255, Math.max(0, g + (Math.random() > 0.5 ? shift/2 : -shift/2)));
    const nb = Math.min(255, Math.max(0, b + (Math.random() > 0.5 ? shift : -shift)));
    return `#${Math.round(nr).toString(16).padStart(2,'0')}${Math.round(ng).toString(16).padStart(2,'0')}${Math.round(nb).toString(16).padStart(2,'0')}`;
}

function createShapeSVG(shape, color, size, rotation) {
    const s = size;
    const half = s / 2;
    let inner = '';

    switch(shape) {
        case 'circle':
            inner = `<circle cx="${half}" cy="${half}" r="${half*0.85}" fill="${color}"/>`;
            break;
        case 'square':
            const pad = s * 0.1;
            inner = `<rect x="${pad}" y="${pad}" width="${s-pad*2}" height="${s-pad*2}" rx="4" fill="${color}"/>`;
            break;
        case 'triangle':
            inner = `<polygon points="${half},${s*0.08} ${s*0.92},${s*0.88} ${s*0.08},${s*0.88}" fill="${color}"/>`;
            break;
        case 'diamond':
            inner = `<polygon points="${half},${s*0.05} ${s*0.92},${half} ${half},${s*0.95} ${s*0.08},${half}" fill="${color}"/>`;
            break;
        case 'star':
            const cx = half, cy = half, or = half*0.85, ir = half*0.38;
            let pts = '';
            for (let i = 0; i < 5; i++) {
                const a1 = (i * 72 - 90) * Math.PI / 180;
                const a2 = ((i * 72 + 36) - 90) * Math.PI / 180;
                pts += `${cx + or * Math.cos(a1)},${cy + or * Math.sin(a1)} ${cx + ir * Math.cos(a2)},${cy + ir * Math.sin(a2)} `;
            }
            inner = `<polygon points="${pts.trim()}" fill="${color}"/>`;
            break;
        case 'hexagon':
            let hpts = '';
            for (let i = 0; i < 6; i++) {
                const a = (i * 60 - 30) * Math.PI / 180;
                hpts += `${cx + half*0.85 * Math.cos(a)},${cy + half*0.85 * Math.sin(a)} `;
            }
            inner = `<polygon points="${hpts.trim()}" fill="${color}"/>`;
            break;
    }

    return `<svg width="${s}" height="${s}" viewBox="0 0 ${s} ${s}" style="transform:rotate(${rotation}deg)">${inner}</svg>`;
}

function renderPuzzle() {
    const p = generatePuzzle();
    const grid = document.getElementById('diffGrid');
    const cellSize = Math.min(72, (Math.min(window.innerWidth, 480) - 48 - p.gridSize * 8 - 32) / p.gridSize);

    grid.style.gridTemplateColumns = `repeat(${p.gridSize}, ${cellSize}px)`;
    grid.innerHTML = '';

    for (let i = 0; i < p.total; i++) {
        const cell = document.createElement('div');
        cell.className = 'diff-cell';
        cell.style.width = cellSize + 'px';
        cell.style.height = cellSize + 'px';
        cell.style.background = 'rgba(255,255,255,0.05)';
        cell.style.border = '1px solid rgba(255,255,255,0.06)';

        const isOdd = i === oddIndex;
        const shape = isOdd ? p.oddShape : p.baseShape;
        const color = isOdd ? p.oddColor : p.baseColor;
        const rotation = isOdd ? p.oddRotation : p.baseRotation;
        const size = isOdd ? p.oddSize : p.baseSize;
        const svgSize = Math.min(cellSize * 0.7, size);

        cell.innerHTML = createShapeSVG(shape, color, svgSize, rotation);
        cell.addEventListener('click', () => onCellClick(i, cell));
        grid.appendChild(cell);
    }
}

function onCellClick(idx, cell) {
    if (!isPlaying || answered) return;
    answered = true;

    if (idx === oddIndex) {
        // Correct
        cell.classList.add('correct', 'found');
        const bonus = currentLevel * 10;
        score += bonus;
        document.getElementById('score').textContent = score;
        document.getElementById('hint').textContent = `✓ 找到了！+${bonus}分`;
        document.getElementById('hint').style.color = '#55efc4';

        setTimeout(() => {
            currentLevel++;
            document.getElementById('level').textContent = currentLevel;
            answered = false;
            document.getElementById('hint').textContent = '找出不同的那个！';
            document.getElementById('hint').style.color = '#6c5ce7';
            renderPuzzle();
        }, 800);
    } else {
        // Wrong
        cell.classList.add('wrong');
        lives--;
        updateLives();
        score = Math.max(0, score - 5);
        document.getElementById('score').textContent = score;
        document.getElementById('hint').textContent = '✗ 不是这个！';
        document.getElementById('hint').style.color = '#ff6b6b';

        // Highlight the correct one
        const grid = document.getElementById('diffGrid');
        grid.children[oddIndex].classList.add('found');

        if (lives <= 0) {
            setTimeout(() => endGame(), 600);
        } else {
            setTimeout(() => {
                currentLevel = Math.max(1, currentLevel - 1);
                document.getElementById('level').textContent = currentLevel;
                answered = false;
                document.getElementById('hint').textContent = '找出不同的那个！';
                document.getElementById('hint').style.color = '#6c5ce7';
                renderPuzzle();
            }, 1000);
        }
    }
}

function updateLives() {
    document.getElementById('lives').textContent = '❤️'.repeat(Math.max(0, lives)) + '🖤'.repeat(Math.max(0, 3 - lives));
}

function startGame() {
    currentLevel = 1;
    lives = 3;
    score = 0;
    isPlaying = true;
    answered = false;

    document.getElementById('level').textContent = '1';
    document.getElementById('score').textContent = '0';
    updateLives();
    document.getElementById('hint').textContent = '找出不同的那个！';
    document.getElementById('hint').style.color = '#6c5ce7';
    document.getElementById('startBtn').textContent = '进行中...';
    document.getElementById('startBtn').style.opacity = '0.5';
    document.getElementById('startBtn').style.pointerEvents = 'none';

    renderPuzzle();
}

function endGame() {
    isPlaying = false;
    if (score > best) {
        best = score;
        localStorage.setItem('spotDiffBest', best);
        bestEl.textContent = best;
    }

    document.getElementById('startBtn').textContent = '开始';
    document.getElementById('startBtn').style.opacity = '';
    document.getElementById('startBtn').style.pointerEvents = '';

    document.getElementById('resultTitle').textContent = score >= 100 ? '🎉 眼力超群！' : '💪 继续练习！';
    document.getElementById('resultScore').textContent = score;
    document.getElementById('resultDetail').innerHTML = `到达第 ${currentLevel} 关<br>最高分: ${best}`;
    document.getElementById('resultOverlay').classList.add('show');
}

function closeResult() {
    document.getElementById('resultOverlay').classList.remove('show');
}

function resetGame() {
    isPlaying = false;
    currentLevel = 1;
    lives = 3;
    score = 0;
    answered = false;

    document.getElementById('level').textContent = '1';
    document.getElementById('score').textContent = '0';
    updateLives();
    document.getElementById('hint').textContent = '找出不同的那个！';
    document.getElementById('hint').style.color = '#6c5ce7';
    document.getElementById('startBtn').textContent = '开始';
    document.getElementById('startBtn').style.opacity = '';
    document.getElementById('startBtn').style.pointerEvents = '';
    document.getElementById('diffGrid').innerHTML = '';
}

window.addEventListener('resize', () => {
    if (isPlaying && !answered) renderPuzzle();
});
</script>
</body>
</html>
