<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>番茄时钟</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            color: #e0e0e0;
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 48px 56px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        h1 {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #fff;
        }

        .mode-label {
            font-size: 16px;
            margin-bottom: 32px;
            color: #e94560;
            font-weight: 500;
            letter-spacing: 2px;
        }

        .timer-ring {
            position: relative;
            width: 280px;
            height: 280px;
            margin: 0 auto 32px;
        }

        .timer-ring svg {
            transform: rotate(-90deg);
            width: 280px;
            height: 280px;
        }

        .timer-ring .bg-circle {
            fill: none;
            stroke: rgba(255, 255, 255, 0.08);
            stroke-width: 8;
        }

        .timer-ring .progress-circle {
            fill: none;
            stroke: #e94560;
            stroke-width: 8;
            stroke-linecap: round;
            stroke-dasharray: 816.81;
            stroke-dashoffset: 0;
            transition: stroke-dashoffset 0.5s ease, stroke 0.3s ease;
        }

        .timer-ring .progress-circle.break-mode {
            stroke: #4ecca3;
        }

        .time-display {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 64px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            color: #fff;
            letter-spacing: 2px;
        }

        .controls {
            display: flex;
            gap: 16px;
            justify-content: center;
            margin-bottom: 32px;
        }

        button {
            border: none;
            border-radius: 14px;
            padding: 14px 32px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            letter-spacing: 1px;
        }

        button:active {
            transform: scale(0.96);
        }

        .btn-start {
            background: linear-gradient(135deg, #e94560, #c23152);
            color: #fff;
            box-shadow: 0 4px 15px rgba(233, 69, 96, 0.4);
        }

        .btn-start:hover {
            box-shadow: 0 6px 20px rgba(233, 69, 96, 0.6);
        }

        .btn-start.running {
            background: linear-gradient(135deg, #ff6b6b, #e94560);
        }

        .btn-reset {
            background: rgba(255, 255, 255, 0.08);
            color: #aaa;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-reset:hover {
            background: rgba(255, 255, 255, 0.12);
            color: #ddd;
        }

        .btn-skip {
            background: rgba(255, 255, 255, 0.08);
            color: #aaa;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-skip:hover {
            background: rgba(255, 255, 255, 0.12);
            color: #ddd;
        }

        .mode-switch {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-bottom: 28px;
        }

        .mode-btn {
            padding: 8px 20px;
            font-size: 14px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.05);
            color: #888;
            border: 1px solid transparent;
        }

        .mode-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #bbb;
        }

        .mode-btn.active {
            background: rgba(233, 69, 96, 0.15);
            color: #e94560;
            border-color: rgba(233, 69, 96, 0.3);
        }

        .mode-btn.active.break-active {
            background: rgba(78, 204, 163, 0.15);
            color: #4ecca3;
            border-color: rgba(78, 204, 163, 0.3);
        }

        .stats {
            display: flex;
            gap: 32px;
            justify-content: center;
            padding-top: 24px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 28px;
            font-weight: 700;
            color: #fff;
        }

        .stat-label {
            font-size: 12px;
            color: #666;
            margin-top: 4px;
            letter-spacing: 1px;
        }

        .notification {
            position: fixed;
            top: 24px;
            right: 24px;
            background: rgba(30, 30, 50, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            padding: 16px 24px;
            color: #fff;
            font-size: 14px;
            font-weight: 500;
            transform: translateX(120%);
            transition: transform 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            z-index: 100;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .notification.show {
            transform: translateX(0);
        }

        .notification .emoji {
            font-size: 20px;
            margin-right: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🍅 番茄时钟</h1>
        <div class="mode-label" id="modeLabel">专注时间</div>

        <div class="mode-switch">
            <button class="mode-btn active" id="btnFocus" onclick="switchMode('focus')">专注</button>
            <button class="mode-btn" id="btnShortBreak" onclick="switchMode('shortBreak')">短休息</button>
            <button class="mode-btn" id="btnLongBreak" onclick="switchMode('longBreak')">长休息</button>
        </div>

        <div class="timer-ring">
            <svg viewBox="0 0 280 280">
                <circle class="bg-circle" cx="140" cy="140" r="130"></circle>
                <circle class="progress-circle" id="progressCircle" cx="140" cy="140" r="130"></circle>
            </svg>
            <div class="time-display" id="timeDisplay">25:00</div>
        </div>

        <div class="controls">
            <button class="btn-reset" onclick="resetTimer()">重置</button>
            <button class="btn-start" id="btnStart" onclick="toggleTimer()">开始</button>
            <button class="btn-skip" onclick="skipTimer()">跳过</button>
        </div>

        <div class="stats">
            <div class="stat-item">
                <div class="stat-value" id="completedCount">0</div>
                <div class="stat-label">已完成</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="totalMinutes">0</div>
                <div class="stat-label">专注(分钟)</div>
            </div>
        </div>
    </div>

    <div class="notification" id="notification">
        <span class="emoji">🍅</span>
        <span id="notificationText">番茄钟完成！</span>
    </div>

    <script>
        const MODES = {
            focus: { duration: 25 * 60, label: '专注时间', color: '#e94560' },
            shortBreak: { duration: 5 * 60, label: '短休�?, color: '#4ecca3' },
            longBreak: { duration: 15 * 60, label: '长休�?, color: '#4ecca3' }
        };

        let currentMode = 'focus';
        let timeLeft = MODES.focus.duration;
        let totalTime = MODES.focus.duration;
        let isRunning = false;
        let timerInterval = null;
        let completedPomodoros = 0;
        let totalFocusMinutes = 0;

        const CIRCUMFERENCE = 2 * Math.PI * 130; // ~816.81

        const timeDisplay = document.getElementById('timeDisplay');
        const progressCircle = document.getElementById('progressCircle');
        const btnStart = document.getElementById('btnStart');
        const modeLabel = document.getElementById('modeLabel');
        const completedCount = document.getElementById('completedCount');
        const totalMinutesEl = document.getElementById('totalMinutes');
        const notification = document.getElementById('notification');
        const notificationText = document.getElementById('notificationText');

        progressCircle.style.strokeDasharray = CIRCUMFERENCE;
        progressCircle.style.strokeDashoffset = 0;

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60);
            const s = seconds % 60;
            return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        }

        function updateDisplay() {
            timeDisplay.textContent = formatTime(timeLeft);
            const progress = 1 - (timeLeft / totalTime);
            const offset = CIRCUMFERENCE * (1 - progress);
            progressCircle.style.strokeDashoffset = offset;
            document.title = `${formatTime(timeLeft)} - 番茄时钟`;
        }

        function switchMode(mode) {
            if (isRunning) return;
            currentMode = mode;
            timeLeft = MODES[mode].duration;
            totalTime = MODES[mode].duration;
            modeLabel.textContent = MODES[mode].label;

            // Update mode buttons
            document.querySelectorAll('.mode-btn').forEach(btn => {
                btn.classList.remove('active', 'break-active');
            });
            const activeBtn = document.getElementById(
                mode === 'focus' ? 'btnFocus' : mode === 'shortBreak' ? 'btnShortBreak' : 'btnLongBreak'
            );
            activeBtn.classList.add('active');
            if (mode !== 'focus') {
                activeBtn.classList.add('break-active');
            }

            // Update progress circle color
            if (mode === 'focus') {
                progressCircle.classList.remove('break-mode');
                modeLabel.style.color = '#e94560';
            } else {
                progressCircle.classList.add('break-mode');
                modeLabel.style.color = '#4ecca3';
            }

            updateDisplay();
        }

        function toggleTimer() {
            if (isRunning) {
                pauseTimer();
            } else {
                startTimer();
            }
        }

        function startTimer() {
            isRunning = true;
            btnStart.textContent = '暂停';
            btnStart.classList.add('running');
            timerInterval = setInterval(() => {
                timeLeft--;
                if (timeLeft <= 0) {
                    timeLeft = 0;
                    updateDisplay();
                    timerComplete();
                    return;
                }
                updateDisplay();
            }, 1000);
        }

        function pauseTimer() {
            isRunning = false;
            btnStart.textContent = '继续';
            btnStart.classList.remove('running');
            clearInterval(timerInterval);
        }

        function resetTimer() {
            clearInterval(timerInterval);
            isRunning = false;
            btnStart.textContent = '开始';
            btnStart.classList.remove('running');
            timeLeft = MODES[currentMode].duration;
            totalTime = MODES[currentMode].duration;
            updateDisplay();
        }

        function skipTimer() {
            timerComplete();
        }

        function timerComplete() {
            clearInterval(timerInterval);
            isRunning = false;
            btnStart.textContent = '开始';
            btnStart.classList.remove('running');

            if (currentMode === 'focus') {
                completedPomodoros++;
                totalFocusMinutes += 25;
                completedCount.textContent = completedPomodoros;
                totalMinutesEl.textContent = totalFocusMinutes;
                showNotification('🍅 专注完成！休息一下吧');
                // Auto switch to break
                if (completedPomodoros % 4 === 0) {
                    switchMode('longBreak');
                } else {
                    switchMode('shortBreak');
                }
            } else {
                showNotification('�?休息结束！继续专注吧');
                switchMode('focus');
            }

            playSound();
        }

        function showNotification(text) {
            notificationText.textContent = text;
            notification.classList.add('show');
            setTimeout(() => {
                notification.classList.remove('show');
            }, 3000);
        }

        function playSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const notes = [523.25, 659.25, 783.99]; // C5, E5, G5
                notes.forEach((freq, i) => {
                    const oscillator = audioCtx.createOscillator();
                    const gainNode = audioCtx.createGain();
                    oscillator.connect(gainNode);
                    gainNode.connect(audioCtx.destination);
                    oscillator.type = 'sine';
                    oscillator.frequency.setValueAtTime(freq, audioCtx.currentTime + i * 0.15);
                    gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime + i * 0.15);
                    gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + i * 0.15 + 0.5);
                    oscillator.start(audioCtx.currentTime + i * 0.15);
                    oscillator.stop(audioCtx.currentTime + i * 0.15 + 0.5);
                });
            } catch (e) {
                // Audio not supported
            }
        }

        // Initialize
        updateDisplay();
    </script>
</body>
</html>
